  <h1 class="visually-hidden">שירים להופעה של ליאור פורת</h1>

  <main class="songs" id="songs"></main>

  <script>
    const songs = [
      { name: "בלוז לשבת", file: "בלוז לשבת" },
      { name: "בלוז לחילוני", file: "בלוז לחילוני" },
      { name: "להיות ישראלי", file: "להיות ישראלי" },
      { name: "לוח וגיר", file: "לוח וגיר" },
      { name: "לאון השען", file: "לאון השען" },
      { name: "בדד", file: "בדד" },
      { name: "תל אביבי", file: "תל אביבי" },
      { name: "קלישאות", file: "בשורה תחתונה (קלישאות)" },
      { name: "כל כך לחוץ", file: "כל כך לחוץ" },
      { name: "צל עץ תמר", file: "צל עץ תמר" },
      { name: "הים נחצה לשניים", file: "הים נחצה לשניים" },
      { name: "תקוע באדום", file: "תקוע באדום" },
      { name: "בלוז לנפטר", file: "בלוז לנפטר" },
      { name: "אסיר 1376", file: "אסיר 1376" },
      { name: "ניפגש שוב בקרוב", file: "ניפגש שוב בקרוב" },
      { name: "הרשימה", file: "הרשימה" }
    ];

    const el = document.getElementById('songs');

    songs.forEach(song => {
      const row = document.createElement('div');
      row.className = 'song-item';

      const a = document.createElement('a');
      const songFileName = song.file || song.name;
      a.href = `${songFileName}.html`;

      const img = document.createElement('img');
      img.src = `../Media/songs/${songFileName}.webp`;
      img.alt = song.name;
      img.className = 'song-thumb';
      img.onerror = function () {
        const placeholder = document.createElement('div');
        placeholder.className = 'song-thumb song-thumb-placeholder';
        placeholder.setAttribute('aria-hidden', 'true');
        placeholder.textContent = '🎵';
        if (this.parentNode) {
          this.parentNode.replaceChild(placeholder, this);
        }
      };

      const spanName = document.createElement('span');
      spanName.className = 'song-name';
      spanName.textContent = song.name;

      a.appendChild(img);
      a.appendChild(spanName);
      row.appendChild(a);
      el.appendChild(row);
    });

    function fitSongFontSize() {
      const names = document.querySelectorAll('.song-name');
      if (!names.length) return;

      const firstCard = document.querySelector('.song-item');
      if (!firstCard) return;

      const cardRect = firstCard.getBoundingClientRect();
      const cardHeight = cardRect.height;
      if (cardHeight <= 0) return;

      const maxAllowedByHeight = Math.floor(cardHeight * 0.45);
      let minFs = 12;
      let maxFs = Math.max(minFs, Math.min(maxAllowedByHeight, 42));
      let bestFs = minFs;

      const root = document.documentElement;

      while (minFs <= maxFs) {
        const testFs = Math.floor((minFs + maxFs) / 2);
        root.style.setProperty('--song-font-size', `${testFs}px`);

        let fits = true;
        for (let i = 0; i < names.length; i++) {
          const el = names[i];
          if (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > cardHeight) {
            fits = false;
            break;
          }
        }

        if (fits) {
          bestFs = testFs;
          minFs = testFs + 1;
        } else {
          maxFs = testFs - 1;
        }
      }

      root.style.setProperty('--song-font-size', `${bestFs}px`);
    }

    fitSongFontSize();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitSongFontSize);
    }
    let resizeTimer;
    window.addEventListener('resize', () => {
      cancelAnimationFrame(resizeTimer);
      resizeTimer = requestAnimationFrame(fitSongFontSize);
    });
  </script>

              <button type="button" class="swatch-btn" data-color="#FFE600" style="background:#FFE600;"
                title="צהוב"></button>
              <button type="button" class="swatch-btn" data-color="#FFFFFF" style="background:#FFFFFF;"
                title="לבן"></button>
              <button type="button" class="swatch-btn" data-color="#00FFFF" style="background:#00FFFF;"
                title="ציאן"></button>
              <button type="button" class="swatch-btn" data-color="#24FF00" style="background:#24FF00;"
                title="ירוק ניאון"></button>
              <label class="custom-picker-btn" title="צבע מותאם אישית">
                <input type="color" id="pickerSub" value="#A5B0C4">
              </label>
            </div>
          </div>

          <!-- 4. אקורדים -->
          <div class="color-option-row">
            <div class="color-row-title">
              <span>אקורדים</span>
            </div>
            <div class="color-swatches" data-type="chord">
              <button type="button" class="swatch-btn" data-color="#FFFFFF" style="background:#FFFFFF;"
                title="לבן מודגש"></button>
              <button type="button" class="swatch-btn" data-color="#FF9800" style="background:#FF9800;"
                title="כתום"></button>
              <button type="button" class="swatch-btn" data-color="#00FFFF" style="background:#00FFFF;"
                title="ציאן"></button>
              <button type="button" class="swatch-btn" data-color="#FFE600" style="background:#FFE600;"
                title="צהוב"></button>
              <button type="button" class="swatch-btn" data-color="#24FF00" style="background:#24FF00;"
                title="ירוק ניאון"></button>
              <label class="custom-picker-btn" title="צבע מותאם אישית">
                <input type="color" id="pickerChord" value="#FFFFFF">
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" id="resetColorsBtn" class="btn-reset">איפוס לברירת מחדל</button>
        <button type="button" id="saveColorsBtn" class="btn-save">שמור הגדרות</button>
      </div>
    </div>
  </div>

  <div id="saveToast" class="save-toast">הגדרות הצבעים נשמרו בהצלחה!</div>

  <script>
    // ── Stage Colors Settings Logic ──
    const DEFAULT_COLORS = {
      verse: '#FFE600',
      chorus: '#24FF00',
      sub: '#A5B0C4',
      chord: '#FFFFFF'
    };

    let stageColors = { ...DEFAULT_COLORS };

    try {
      const saved = JSON.parse(localStorage.getItem('stage_colors') || '{}');
      if (saved.sub === '#FFE600') {
        saved.sub = '#A5B0C4';
        localStorage.setItem('stage_colors', JSON.stringify({ ...DEFAULT_COLORS, ...saved }));
      }
      stageColors = { ...DEFAULT_COLORS, ...saved };
    } catch (e) { }

    const colorModal = document.getElementById('colorSettingsModal');
    const openSettingsBtn = document.getElementById('showSettingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsModal');
    const saveColorsBtn = document.getElementById('saveColorsBtn');
    const resetColorsBtn = document.getElementById('resetColorsBtn');
    const saveToast = document.getElementById('saveToast');

    const prevVerse = document.getElementById('prevVerse');
    const prevChorus = document.getElementById('prevChorus');
    const prevSub = document.getElementById('prevSub');
    const prevChord = document.getElementById('prevChord');

    const colorPickers = {
      verse: document.getElementById('pickerVerse'),
      chorus: document.getElementById('pickerChorus'),
      sub: document.getElementById('pickerSub'),
      chord: document.getElementById('pickerChord')
    };

    function updatePreviewScreen() {
      if (prevVerse) prevVerse.style.color = stageColors.verse;
      if (prevChorus) {
        prevChorus.style.color = stageColors.chorus;
        prevChorus.style.textShadow = `0 0 2px ${stageColors.chorus}99`;
      }
      if (prevSub) prevSub.style.color = stageColors.sub;
      if (prevChord) prevChord.style.color = stageColors.chord;

      ['verse', 'chorus', 'sub', 'chord'].forEach(type => {
        const val = stageColors[type];
        if (colorPickers[type] && val && val.startsWith('#')) {
          colorPickers[type].value = val.length === 7 ? val : '#ffffff';
        }

        const swatches = document.querySelectorAll(`.color-swatches[data-type="${type}"] .swatch-btn`);
        swatches.forEach(btn => {
          if (btn.dataset.color.toLowerCase() === (val || '').toLowerCase()) {
            btn.classList.add('selected');
          } else {
            btn.classList.remove('selected');
          }
        });
      });
    }

    function openColorModal() {
      try {
        const saved = JSON.parse(localStorage.getItem('stage_colors') || '{}');
        stageColors = { ...DEFAULT_COLORS, ...saved };
      } catch (e) { }
      updatePreviewScreen();
      colorModal.classList.add('active');
      colorModal.setAttribute('aria-hidden', 'false');
    }

    function closeColorModal() {
      colorModal.classList.remove('active');
      colorModal.setAttribute('aria-hidden', 'true');
    }

    if (openSettingsBtn) openSettingsBtn.addEventListener('click', openColorModal);
    if (closeSettingsBtn) closeSettingsBtn.addEventListener('click', closeColorModal);

    colorModal.addEventListener('click', (e) => {
      if (e.target === colorModal) closeColorModal();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && colorModal.classList.contains('active')) {
        closeColorModal();
      }
    });

    // Swatch clicks
    document.querySelectorAll('.color-swatches .swatch-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.closest('.color-swatches').dataset.type;
        const color = btn.dataset.color;
        stageColors[type] = color;
        updatePreviewScreen();
      });
    });

    // Custom Color picker inputs
    ['verse', 'chorus', 'sub', 'chord'].forEach(type => {
      if (colorPickers[type]) {
        colorPickers[type].addEventListener('input', (e) => {
          stageColors[type] = e.target.value;
          updatePreviewScreen();
        });
      }
    });

    // Save Settings
    saveColorsBtn.addEventListener('click', () => {
      try {
        localStorage.setItem('stage_colors', JSON.stringify(stageColors));
      } catch (e) { }
      closeColorModal();
      saveToast.classList.add('show');
      setTimeout(() => saveToast.classList.remove('show'), 2400);
    });

    // Reset Defaults
    resetColorsBtn.addEventListener('click', () => {
      stageColors = { ...DEFAULT_COLORS };
      updatePreviewScreen();
    });
  </script>
  <script src="../script.js?v=1.5.5"></script>
</body>

</html>
