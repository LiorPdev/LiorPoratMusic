    .song-topbar {

      top: 0;
      left: 0;
      right: 0;
      height: 56px;

      -webkit-backdrop-filter: blur(12px);

    .topbar-inner {
      max-width: 100%;
      height: 100%;
      margin: 0;
      padding: 0 20px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;

    .song-topbar .songs-title {

      font-weight: 700;

    }

    .close-btn {

      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 20px;
      line-height: 1;

      transition: opacity 0.2s, transform 0.2s, border-color 0.2s;

      max-width: 100%;

      margin: 0;

      box-sizing: border-box;
      display: grid;
      gap: clamp(8px, 1.2vh, 14px);
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      overflow: hidden;

    /* Portrait / vertical screens: 2 columns x 8 rows */

        grid-template-rows: repeat(8, 1fr);

      margin: 0;

<body>
  <div class="song-topbar">
    <div class="topbar-inner">
      <div class="title-group">

  <h1 class="visually-hidden">שירים להופעה של ליאור פורת</h1>

  <main class="songs" id="songs"></main>

  <script>
    const songs = [
      { name: "בלוז לשבת", file: "בלוז לשבת" },
      { name: "בלוז לחילוני", file: "בלוז לחילוני" },
      { name: "להיות ישראלי", file: "להיות ישראלי" },
      { name: "לוח וגיר", file: "לוח וגיר" },
      { name: "לאון השען", file: "לאון השען" },
      { name: "בדד", file: "בדד" },
      { name: "תל אביבי", file: "תל אביבי" },
      { name: "קלישאות", file: "בשורה תחתונה (קלישאות)" },
      { name: "כל כך לחוץ", file: "כל כך לחוץ" },
      { name: "צל עץ תמר", file: "צל עץ תמר" },
      { name: "הים נחצה לשניים", file: "הים נחצה לשניים" },
      { name: "תקוע באדום", file: "תקוע באדום" },
      { name: "בלוז לנפטר", file: "בלוז לנפטר" },
      { name: "אסיר 1376", file: "אסיר 1376" },
      { name: "ניפגש שוב בקרוב", file: "ניפגש שוב בקרוב" },
      { name: "הרשימה", file: "הרשימה" }
    ];

    const el = document.getElementById('songs');

    songs.forEach(song => {
      const row = document.createElement('div');
      row.className = 'song-item';

      const a = document.createElement('a');
      const songFileName = song.file || song.name;
      a.href = `${songFileName}.html`;

      const img = document.createElement('img');
      img.src = `../Media/songs/${songFileName}.webp`;
      img.alt = song.name;
      img.className = 'song-thumb';
      img.onerror = function () {
        const placeholder = document.createElement('div');
        placeholder.className = 'song-thumb song-thumb-placeholder';
        placeholder.setAttribute('aria-hidden', 'true');
        placeholder.textContent = '🎵';
        if (this.parentNode) {
          this.parentNode.replaceChild(placeholder, this);
        }
      };

      const spanName = document.createElement('span');
      spanName.className = 'song-name';
      spanName.textContent = song.name;

      a.appendChild(img);
      a.appendChild(spanName);
      row.appendChild(a);
      el.appendChild(row);
    });

    function fitSongFontSize() {
      const names = document.querySelectorAll('.song-name');
      if (!names.length) return;

      const firstCard = document.querySelector('.song-item');
      if (!firstCard) return;

      const cardRect = firstCard.getBoundingClientRect();
      const cardHeight = cardRect.height;
      if (cardHeight <= 0) return;

      const maxAllowedByHeight = Math.floor(cardHeight * 0.45);
      let minFs = 12;
      let maxFs = Math.max(minFs, Math.min(maxAllowedByHeight, 42));
      let bestFs = minFs;

      const root = document.documentElement;

      while (minFs <= maxFs) {
        const testFs = Math.floor((minFs + maxFs) / 2);
        root.style.setProperty('--song-font-size', `${testFs}px`);

        let fits = true;
        for (let i = 0; i < names.length; i++) {
          const el = names[i];
          if (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > cardHeight) {
            fits = false;
            break;
          }
        }

        if (fits) {
          bestFs = testFs;
          minFs = testFs + 1;
        } else {
          maxFs = testFs - 1;
        }
      }

      root.style.setProperty('--song-font-size', `${bestFs}px`);
    }

    fitSongFontSize();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitSongFontSize);
    }
    let resizeTimer;
    window.addEventListener('resize', () => {
      cancelAnimationFrame(resizeTimer);
      resizeTimer = requestAnimationFrame(fitSongFontSize);
    });
  </script>

            </div>
          </div>

          <!-- 3. שורות שאני לא שר -->
          <div class="color-option-row">
            <div class="color-row-title">
              <span>שורות שאני לא שר</span>
            </div>
            <div class="color-swatches" data-type="sub">
              <button type="button" class="swatch-btn" data-color="#A5B0C4" style="background:#A5B0C4;"
                title="אפור כסוף"></button>
              <button type="button" class="swatch-btn" data-color="#FFE600" style="background:#FFE600;"
                title="צהוב"></button>
              <button type="button" class="swatch-btn" data-color="#FFFFFF" style="background:#FFFFFF;"
                title="לבן"></button>
              <button type="button" class="swatch-btn" data-color="#00FFFF" style="background:#00FFFF;"
                title="ציאן"></button>
              <button type="button" class="swatch-btn" data-color="#24FF00" style="background:#24FF00;"
                title="ירוק ניאון"></button>
              <label class="custom-picker-btn" title="צבע מותאם אישית">
                <input type="color" id="pickerSub" value="#A5B0C4">
              </label>
            </div>
          </div>

          <!-- 4. אקורדים -->
          <div class="color-option-row">
            <div class="color-row-title">
              <span>אקורדים</span>
            </div>
            <div class="color-swatches" data-type="chord">
              <button type="button" class="swatch-btn" data-color="#FFFFFF" style="background:#FFFFFF;"
                title="לבן מודגש"></button>
              <button type="button" class="swatch-btn" data-color="#FF9800" style="background:#FF9800;"
                title="כתום"></button>
              <button type="button" class="swatch-btn" data-color="#00FFFF" style="background:#00FFFF;"
                title="ציאן"></button>
              <button type="button" class="swatch-btn" data-color="#FFE600" style="background:#FFE600;"
                title="צהוב"></button>
              <button type="button" class="swatch-btn" data-color="#24FF00" style="background:#24FF00;"
                title="ירוק ניאון"></button>
              <label class="custom-picker-btn" title="צבע מותאם אישית">
                <input type="color" id="pickerChord" value="#FFFFFF">
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" id="resetColorsBtn" class="btn-reset">איפוס לברירת מחדל</button>
        <button type="button" id="saveColorsBtn" class="btn-save">שמור הגדרות</button>
      </div>
    </div>
  </div>

  <div id="saveToast" class="save-toast">הגדרות הצבעים נשמרו בהצלחה!</div>

  <script>
    // ── Stage Colors Settings Logic ──
    const DEFAULT_COLORS = {
      verse: '#FFE600',
      chorus: '#24FF00',
      sub: '#A5B0C4',
      chord: '#FFFFFF'
    };

    let stageColors = { ...DEFAULT_COLORS };

    try {
      const saved = JSON.parse(localStorage.getItem('stage_colors') || '{}');
      if (saved.sub === '#FFE600') {
        saved.sub = '#A5B0C4';
        localStorage.setItem('stage_colors', JSON.stringify({ ...DEFAULT_COLORS, ...saved }));
      }
      stageColors = { ...DEFAULT_COLORS, ...saved };
    } catch (e) { }

    const colorModal = document.getElementById('colorSettingsModal');
    const openSettingsBtn = document.getElementById('showSettingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsModal');
    const saveColorsBtn = document.getElementById('saveColorsBtn');
    const resetColorsBtn = document.getElementById('resetColorsBtn');
    const saveToast = document.getElementById('saveToast');

    const prevVerse = document.getElementById('prevVerse');
    const prevChorus = document.getElementById('prevChorus');
    const prevSub = document.getElementById('prevSub');
    const prevChord = document.getElementById('prevChord');

    const colorPickers = {
      verse: document.getElementById('pickerVerse'),
      chorus: document.getElementById('pickerChorus'),
      sub: document.getElementById('pickerSub'),
      chord: document.getElementById('pickerChord')
    };

    function updatePreviewScreen() {
      if (prevVerse) prevVerse.style.color = stageColors.verse;
      if (prevChorus) {
        prevChorus.style.color = stageColors.chorus;
        prevChorus.style.textShadow = `0 0 2px ${stageColors.chorus}99`;
      }
      if (prevSub) prevSub.style.color = stageColors.sub;
      if (prevChord) prevChord.style.color = stageColors.chord;

      ['verse', 'chorus', 'sub', 'chord'].forEach(type => {
        const val = stageColors[type];
        if (colorPickers[type] && val && val.startsWith('#')) {
          colorPickers[type].value = val.length === 7 ? val : '#ffffff';
        }

        const swatches = document.querySelectorAll(`.color-swatches[data-type="${type}"] .swatch-btn`);
        swatches.forEach(btn => {
          if (btn.dataset.color.toLowerCase() === (val || '').toLowerCase()) {
            btn.classList.add('selected');
          } else {
            btn.classList.remove('selected');
          }
        });
      });
    }

    function openColorModal() {
      try {
        const saved = JSON.parse(localStorage.getItem('stage_colors') || '{}');
        stageColors = { ...DEFAULT_COLORS, ...saved };
      } catch (e) { }
      updatePreviewScreen();
      colorModal.classList.add('active');
      colorModal.setAttribute('aria-hidden', 'false');
    }

    function closeColorModal() {
      colorModal.classList.remove('active');
      colorModal.setAttribute('aria-hidden', 'true');
      if (typeof ensurePedalFocus === 'function') ensurePedalFocus();
    }

    if (openSettingsBtn) openSettingsBtn.addEventListener('click', openColorModal);
    if (closeSettingsBtn) closeSettingsBtn.addEventListener('click', closeColorModal);

    colorModal.addEventListener('click', (e) => {
      if (e.target === colorModal) closeColorModal();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && colorModal.classList.contains('active')) {
        closeColorModal();
      }
    });

    // Swatch clicks
    document.querySelectorAll('.color-swatches .swatch-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.closest('.color-swatches').dataset.type;
        const color = btn.dataset.color;
        stageColors[type] = color;
        updatePreviewScreen();
      });
    });

    // Custom Color picker inputs
    ['verse', 'chorus', 'sub', 'chord'].forEach(type => {
      if (colorPickers[type]) {
        colorPickers[type].addEventListener('input', (e) => {
          stageColors[type] = e.target.value;
          updatePreviewScreen();
        });
      }
    });

    // Save Settings
    saveColorsBtn.addEventListener('click', () => {
      try {
        localStorage.setItem('stage_colors', JSON.stringify(stageColors));
      } catch (e) { }
      closeColorModal();
      saveToast.classList.add('show');
      setTimeout(() => saveToast.classList.remove('show'), 2400);
    });

    // Reset Defaults
    resetColorsBtn.addEventListener('click', () => {
      stageColors = { ...DEFAULT_COLORS };
      updatePreviewScreen();
    });

    // ── Hardware Bluetooth Foot Pedal & Keyboard Support ─────────────────────
    const pedalFocusSink = document.createElement('input');
    pedalFocusSink.type = 'text';
    pedalFocusSink.id = 'pedal-focus-sink';
    pedalFocusSink.setAttribute('inputmode', 'none');
    pedalFocusSink.setAttribute('tabindex', '0');
    pedalFocusSink.setAttribute('autocomplete', 'off');
    pedalFocusSink.setAttribute('autocorrect', 'off');
    pedalFocusSink.setAttribute('autocapitalize', 'off');
    pedalFocusSink.setAttribute('spellcheck', 'false');
    pedalFocusSink.style.cssText = 'position:fixed;bottom:12px;right:12px;width:30px;height:30px;opacity:0.01;border:none;margin:0;padding:0;background:transparent;caret-color:transparent;outline:none;z-index:9999;';
    document.body.appendChild(pedalFocusSink);

    // ── On-Screen Real-Time Debug HUD ──────────────────────────────────────────
    const debugHud = document.createElement('div');
    debugHud.id = 'pedal-debug-hud';
    debugHud.style.cssText = [
      'position: fixed',
      'bottom: 12px',
      'left: 12px',
      'right: 12px',
      'max-width: 480px',
      'margin: 0 auto',
      'background: rgba(15, 23, 42, 0.95)',
      'border: 1px solid #6366f1',
      'border-radius: 12px',
      'padding: 10px 14px',
      'color: #f8fafc',
      'font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
      'font-size: 11px',
      'line-height: 1.4',
      'z-index: 100000',
      'box-shadow: 0 10px 30px rgba(0,0,0,0.85)',
      'backdrop-filter: blur(12px)',
      '-webkit-backdrop-filter: blur(12px)',
      'direction: ltr',
      'text-align: left'
    ].join(';');

    debugHud.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; border-bottom:1px solid rgba(255,255,255,0.12); padding-bottom:5px;">
        <span style="font-weight:700; color:#818cf8; display:flex; align-items:center; gap:6px;">
          <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e;" id="pedal-hud-indicator"></span>
          PEDAL DEBUG HUD (SHOW MENU)
        </span>
        <div style="display:flex; gap:6px; align-items:center;">
          <button type="button" id="pedal-hud-focus-btn" style="background:#4f46e5; color:#fff; border:none; border-radius:6px; padding:3px 9px; font-size:11px; font-weight:600; cursor:pointer;">Focus Pedal</button>
          <button type="button" id="pedal-hud-close-btn" style="background:rgba(255,255,255,0.1); color:#94a3b8; border:none; border-radius:6px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;">&times;</button>
        </div>
      </div>
      <div style="margin-bottom:3px;"><span style="color:#94a3b8;">Active Target:</span> <span id="pedal-hud-active" style="color:#38bdf8; font-weight:600;">detecting...</span></div>
      <div style="margin-bottom:3px;"><span style="color:#94a3b8;">Last Action:</span> <span id="pedal-hud-action" style="color:#4ade80; font-weight:700;">NONE</span></div>
      <div style="margin-bottom:2px; color:#94a3b8;">Recent Keystrokes / Inputs:</div>
      <div id="pedal-hud-log" style="background:rgba(0,0,0,0.5); border-radius:6px; padding:6px 8px; max-height:85px; overflow-y:auto; color:#e2e8f0; font-size:10.5px;">Waiting for pedal stomp or keypress...</div>
    `;
    document.body.appendChild(debugHud);

    const recentLogs = [];
    function logDebug(type, details) {
      const timeStr = new Date().toTimeString().split(' ')[0] + '.' + String(Date.now() % 1000).padStart(3, '0');
      const line = `[${timeStr}] ${type}: ${details}`;
      console.log('[PEDAL-DEBUG]', line);
      recentLogs.unshift(line);
      if (recentLogs.length > 5) recentLogs.pop();
      const logEl = document.getElementById('pedal-hud-log');
      if (logEl) {
        logEl.innerHTML = recentLogs.map(l => `<div>${l}</div>`).join('');
      }
      updateActiveElementDisplay();
    }

    function logAction(act) {
      console.log('[PEDAL-ACTION]', act);
      const actEl = document.getElementById('pedal-hud-action');
      if (actEl) {
        actEl.textContent = act;
        actEl.style.color = '#4ade80';
      }
      const indicator = document.getElementById('pedal-hud-indicator');
      if (indicator) {
        indicator.style.background = '#38bdf8';
        setTimeout(() => { if (indicator) indicator.style.background = '#22c55e'; }, 300);
      }
    }

    function updateActiveElementDisplay() {
      const active = document.activeElement;
      const actEl = document.getElementById('pedal-hud-active');
      const indicator = document.getElementById('pedal-hud-indicator');
      if (!actEl) return;
      if (active === pedalFocusSink) {
        actEl.textContent = 'PEDAL SINK (READY ✓)';
        actEl.style.color = '#4ade80';
        if (indicator) indicator.style.background = '#22c55e';
      } else if (active) {
        actEl.textContent = `<${active.tagName.toLowerCase()}${active.id ? '#' + active.id : ''}>`;
        actEl.style.color = '#f59e0b';
        if (indicator) indicator.style.background = '#f59e0b';
      } else {
        actEl.textContent = 'NONE';
        actEl.style.color = '#ef4444';
        if (indicator) indicator.style.background = '#ef4444';
      }
    }

    const focusBtn = document.getElementById('pedal-hud-focus-btn');
    if (focusBtn) {
      focusBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        ensurePedalFocus();
        logDebug('manual-tap', 'Focus Pedal button tapped');
      });
    }
    const closeHudBtn = document.getElementById('pedal-hud-close-btn');
    if (closeHudBtn) {
      closeHudBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        debugHud.style.display = 'none';
      });
    }

    let selectedSongIdx = -1;
    const songCards = document.querySelectorAll('.song-item');

    function highlightSong(idx) {
      if (!songCards.length) return;
      selectedSongIdx = Math.max(0, Math.min(songCards.length - 1, idx));
      songCards.forEach((c, i) => {
        if (i === selectedSongIdx) {
          c.classList.add('pedal-selected');
          c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        } else {
          c.classList.remove('pedal-selected');
        }
      });
      logAction(`HIGHLIGHT SONG: #${selectedSongIdx + 1} (${songCards[selectedSongIdx].textContent.trim()})`);
    }

    function openSelectedSong() {
      const targetIdx = selectedSongIdx >= 0 ? selectedSongIdx : 0;
      const targetCard = songCards[targetIdx];
      if (targetCard) {
        const link = targetCard.querySelector('a');
        if (link && link.href) {
          logAction(`OPEN SONG: #${targetIdx + 1} (${targetCard.textContent.trim()})`);
          window.location.href = link.href;
        }
      }
    }

    function ensurePedalFocus() {
      if (colorModal.classList.contains('active')) return;
      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
        if (active !== pedalFocusSink) {
          updateActiveElementDisplay();
          return;
        }
      }
      if (active && (active.tagName === 'BUTTON' || active.tagName === 'A')) {
        active.blur();
      }
      try {
        pedalFocusSink.focus({ preventScroll: true });
      } catch (_) {
        try { pedalFocusSink.focus(); } catch (__) {}
      }
      updateActiveElementDisplay();
    }

    ensurePedalFocus();
    setTimeout(ensurePedalFocus, 100);
    setTimeout(ensurePedalFocus, 400);

    ['click', 'touchend', 'pointerup'].forEach(evt => {
      document.addEventListener(evt, (e) => {
        if (colorModal.classList.contains('active')) return;
        if (e.target && e.target.tagName === 'INPUT' && e.target !== pedalFocusSink) return;
        if (e.target && e.target.closest('#pedal-debug-hud')) return;
        setTimeout(ensurePedalFocus, 50);
      }, { passive: true });
    });

    window.addEventListener('focus', ensurePedalFocus);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') ensurePedalFocus();
    });
    document.addEventListener('fullscreenchange', ensurePedalFocus);
    pedalFocusSink.addEventListener('blur', () => {
      setTimeout(ensurePedalFocus, 80);
    });

    // Blur buttons/links after click so future pedal taps don't click them
    document.addEventListener('click', (e) => {
      if (e.target && typeof e.target.closest === 'function') {
        const btnOrLink = e.target.closest('button, a');
        if (btnOrLink && !btnOrLink.closest('#pedal-debug-hud')) {
          setTimeout(() => {
            try { btnOrLink.blur(); } catch (_) {}
            ensurePedalFocus();
          }, 40);
        }
      }
    }, { capture: true, passive: true });

    let lastPedalTime = 0;

    // Support pedals emitting text input events (like in WhatsApp/Notes)
    pedalFocusSink.addEventListener('beforeinput', (e) => {
      if (colorModal.classList.contains('active')) return;
      const data = e.data || '';
      const inputType = e.inputType || '';
      logDebug('beforeinput', `data="${data}" type="${inputType}"`);

      if (data === ' ' || data === '\n' || data === '\r' || inputType === 'insertParagraph' || inputType === 'insertLineBreak') {
        e.preventDefault();
        pedalFocusSink.value = '';
        const now = performance.now();
        if (now - lastPedalTime < 240) return;
        lastPedalTime = now;
        logAction('PEDAL INPUT -> OPEN SONG');
        openSelectedSong();
      }
    });

    pedalFocusSink.addEventListener('input', () => {
      if (colorModal.classList.contains('active')) return;
      const val = pedalFocusSink.value || '';
      logDebug('input', `value="${val}"`);
      if (val.includes(' ') || val.includes('\n') || val.includes('\r')) {
        pedalFocusSink.value = '';
        const now = performance.now();
        if (now - lastPedalTime >= 240) {
          lastPedalTime = now;
          logAction('PEDAL INPUT -> OPEN SONG');
          openSelectedSong();
        }
      }
    });

    function handleShowPedalKey(e) {
      if (colorModal.classList.contains('active')) return;

      const code = e.code || '';
      const key = e.key || '';
      const keyCode = e.keyCode || e.which || 0;
      const targetTag = (e.target && e.target.tagName) || '';

      logDebug('keydown', `key="${key}" code="${code}" which=${keyCode} target=<${targetTag}>`);

      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable) && active !== pedalFocusSink) {
        return;
      }

      const isSpace = code === 'Space' || key === ' ' || key === 'Spacebar' || key === 'Space' || keyCode === 32 || (key === 'Unidentified' && keyCode === 32);
      const isEnter = code === 'Enter' || code === 'NumpadEnter' || key === 'Enter' || keyCode === 13 || (key === 'Unidentified' && keyCode === 13);
      const isPageDown = code === 'PageDown' || key === 'PageDown' || keyCode === 34;
      const isPageUp = code === 'PageUp' || key === 'PageUp' || keyCode === 33;
      const isDown = code === 'ArrowDown' || key === 'ArrowDown' || keyCode === 40;
      const isUp = code === 'ArrowUp' || key === 'ArrowUp' || keyCode === 38;
      const isLeft = code === 'ArrowLeft' || key === 'ArrowLeft' || keyCode === 37;
      const isRight = code === 'ArrowRight' || key === 'ArrowRight' || keyCode === 39;

      if (isSpace || isEnter) {
        e.preventDefault();
        e.stopPropagation();
        if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        const now = performance.now();
        if (e.repeat || (now - lastPedalTime < 240)) {
          logDebug('debounce', 'space/enter ignored (debounce)');
          return;
        }
        lastPedalTime = now;
        logAction('SPACE/ENTER (keydown) -> OPEN SONG');
        openSelectedSong();
        return;
      }

      // Grid navigation (columns depend on screen width/aspect ratio: 4 cols on wide, 2 cols on portrait)
      const isPortrait = window.matchMedia('(max-aspect-ratio: 1/1)').matches;
      const cols = isPortrait ? 2 : 4;

      if (isDown || isPageDown) {
        e.preventDefault();
        e.stopPropagation();
        const now = performance.now();
        if (now - lastPedalTime < 180) return;
        lastPedalTime = now;
        highlightSong(selectedSongIdx === -1 ? 0 : selectedSongIdx + cols);
      } else if (isUp || isPageUp) {
        e.preventDefault();
        e.stopPropagation();
        const now = performance.now();
        if (now - lastPedalTime < 180) return;
        lastPedalTime = now;
        highlightSong(selectedSongIdx === -1 ? 0 : selectedSongIdx - cols);
      } else if (isLeft) { // In RTL, Left moves to the next card
        e.preventDefault();
        e.stopPropagation();
        const now = performance.now();
        if (now - lastPedalTime < 180) return;
        lastPedalTime = now;
        highlightSong(selectedSongIdx === -1 ? 0 : selectedSongIdx + 1);
      } else if (isRight) { // In RTL, Right moves to the previous card
        e.preventDefault();
        e.stopPropagation();
        const now = performance.now();
        if (now - lastPedalTime < 180) return;
        lastPedalTime = now;
        highlightSong(selectedSongIdx === -1 ? 0 : selectedSongIdx - 1);
      }
    }

    function handleShowPedalKeyup(e) {
      if (colorModal.classList.contains('active')) return;
      const code = e.code || '';
      const key = e.key || '';
      const keyCode = e.keyCode || e.which || 0;
      logDebug('keyup', `key="${key}" code="${code}" which=${keyCode}`);
      if (code === 'Space' || key === ' ' || key === 'Spacebar' || keyCode === 32 || code === 'Enter' || key === 'Enter' || keyCode === 13) {
        e.preventDefault();
        e.stopPropagation();
      }
    }

    window.addEventListener('keydown', handleShowPedalKey, { capture: true });
    document.addEventListener('keydown', handleShowPedalKey, { capture: true });
    pedalFocusSink.addEventListener('keydown', handleShowPedalKey, { capture: true });

    window.addEventListener('keyup', handleShowPedalKeyup, { capture: true });
    document.addEventListener('keyup', handleShowPedalKeyup, { capture: true });
    pedalFocusSink.addEventListener('keyup', handleShowPedalKeyup, { capture: true });
  </script>
  <script src="../script.js?v=1.6.2"></script>
</body>
