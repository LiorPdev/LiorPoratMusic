מתקשר אלייך את לא עונה
וואוו... הנה עוד ערב אבוד
מסתכל על התקרה הלבנה
מתעלם מהשעון כל שעה
ואו... הנה עוד ערב אבוד

  כל הלילה, מתהפך במיטה

אם לקום או להשאר לידי
ואו... הנה עוד ערב אבוד

  כל הלילה...

את חייבת לנסות להתקשר
עוד שניה אני מתפורר
ואו... הנה עוד ערב אבוד...
