    <script type="text/plain" id="lyrics">
לטייל עם חברים
אולי לשתות איתם כוסית
אתם יודעים
לצאת איתך לדייט מוצלח
אולי גם לא מוצלח
ולעשות את הדברים הרגילים

לאכול במסעדות
לטעום מהסירים של אמא ולבכות
וגם לנסוע או לטוס רחוק
לראות עולם
וקצת לברוח מכולם

    ואם את אומרת
    זה לא מספיק לי
    אז איך אני יוצא מדעתי
    ואת לא שומעת
    לא רואה
    ת'דברים הכי פשוטים שבחיים

בסלון עם הספרים
ושוב לבהות בערב מול המסכים
לצאת להצגות
וגם לצחוק אולי לבכות
ולעשות את הדברים הרגילים

להירדם איתך בחשכה
או רק להתכרבל מתחת לשמיכה
לנסוע יחד להורים, שלי, שלך
לעוד ביקור
ספק מוצלח
